[package]
name = "caterpillar-voting-core-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
caterpillar-voting-core = { path = "../core" }
wasm-bindgen = "0.2"
rand.workspace = true
getrandom = { version = "0.2", features = ["js"] } # getrandum used implicitly by wasm-bindgen

[features]
default = []