[package]
name = "caterpillar-voting-core-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
caterpillar-voting-core = { path = "../core" }
wasm-bindgen = "0.2"
rand_core = { workspace = true }
rand_chacha = { version = "0.3.1", default-features = false }
getrandom = { version = "0.2.17", features = ["js"] }

[features]
default = []